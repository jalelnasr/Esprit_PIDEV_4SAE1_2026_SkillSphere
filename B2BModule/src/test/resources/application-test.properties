# Configuration pour les tests
spring.application.name=B2BMODULE-TEST

# H2 In-Memory Database pour les tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Désactiver les logs pendant les tests
spring.jpa.show-sql=false
logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.example.b2bmodule=ERROR

# JWT Configuration (pour les tests)
app.jwt.secret=THIS_IS_A_VERY_LONG_SECRET_KEY_CHANGE_ME_1234567890_ABCDEFG
app.jwt.expiration-ms=86400000

# Désactiver Eureka pour les tests
eureka.client.enabled=false

# Désactiver l'email pour les tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test

# Désactiver OpenFeign pour les tests
feign.client.config.default.connectTimeout=1000
feign.client.config.default.readTimeout=1000
