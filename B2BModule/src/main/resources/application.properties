spring.application.name=B2BMODULE

# DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/b2bmodule?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# LOGGING
logging.level.root=WARN
logging.level.org.springframework.web=DEBUG
logging.level.org.example.b2bmodule=DEBUG

# PORT
server.port=8083

# ============================================
# JWT CONFIGURATION
# ============================================
# Secret JWT (doit être le MÊME que PlatformeBack)
jwt.secret=THIS_IS_A_VERY_LONG_SECRET_KEY_CHANGE_ME_1234567890_ABCDEFG
jwt.expiration=86400000

# MODULE USER URL (via Eureka)
user.module.url=http://auth-service

# SWAGGER
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================
# EUREKA CLIENT
# ============================================
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ============================================
# OPENFEIGN CONFIGURATION
# ============================================
# Logging level for Feign clients
logging.level.org.example.b2bmodule.client=DEBUG

# Feign client configuration
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000
feign.client.config.default.loggerLevel=BASIC

# Feign compression (optional - improves performance)
feign.compression.request.enabled=true
feign.compression.response.enabled=true
feign.compression.request.mime-types=text/xml,application/xml,application/json
feign.compression.request.min-request-size=2048

# ============================================
# EMAIL CONFIGURATION (Gmail SMTP)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=aziz2guizeni@gmail.com
spring.mail.password=dabwejwnyqaryees
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# ============================================
# SCHEDULING
# ============================================
spring.task.scheduling.pool.size=2
