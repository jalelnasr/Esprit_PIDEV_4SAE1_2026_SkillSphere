server.port=8085
spring.application.name=PLATFORMEBACK

spring.datasource.url=jdbc:mysql://localhost:3306/platforme?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Eureka (PORT 8762)
eureka.client.service-url.defaultZone=http://localhost:8762/eureka
eureka.instance.prefer-ip-address=true

# JWT
app.jwt.secret=THIS_IS_A_VERY_LONG_SECRET_KEY_CHANGE_ME_1234567890_ABCDEFG
app.jwt.expiration-ms=86400000

# API KEY inter-service (Formation -> PlatformeBack)
service.api.key=formation-to-user-secret