server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/platforme?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
app.jwt.secret=THIS_IS_A_VERY_LONG_SECRET_KEY_CHANGE_ME_1234567890_ABCDEFG
app.jwt.expiration-ms=86400000

# Admin Seeder Configuration
gamix.admin.email=${GAMIX_ADMIN_EMAIL:admin@gamix.local}
gamix.admin.password=${GAMIX_ADMIN_PASSWORD:Admin1234!}

# Docker configuration (works with Docker Desktop on Windows/Mac/Linux)
# Windows Docker Desktop (default): npipe:////./pipe/docker_engine (works out of the box)
# Linux / Mac: unix:///var/run/docker.sock
# Alternative TCP: tcp://localhost:2375 (requires enabling in Docker Desktop Settings > General)
docker.host=${DOCKER_HOST:npipe:////./pipe/docker_engine}
docker.tls.verify=${DOCKER_TLS_VERIFY:false}
gamix.container.port-range-start=9100
gamix.container.port-range-end=9200
