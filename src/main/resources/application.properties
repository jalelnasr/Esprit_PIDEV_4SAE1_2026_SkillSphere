spring.application.name=platform-evaluation-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/evaluation_db
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
app.jwt.secret=THIS_IS_A_VERY_LONG_SECRET_KEY_CHANGE_ME_1234567890_ABCDEFG

# Inter-service user lookup
user.service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8085}
user.service.api-key=${USER_SERVICE_API_KEY:formation-to-user-secret}

# Certificate email notification toggle and sender
app.notifications.certificates.enabled=${CERTIFICATE_EMAIL_ENABLED:true}
app.notifications.certificates.from=${CERTIFICATE_EMAIL_FROM:badissbenzarti@gmail.com}

# Gmail SMTP
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${GMAIL_USERNAME:badissbenzarti@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000