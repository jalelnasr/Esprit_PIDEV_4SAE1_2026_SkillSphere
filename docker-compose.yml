version: '3.8'

services:

  # ============================================
  # MySQL - Base de données PlatformeBack (auth)
  # ============================================
  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: platforme
    ports:
      - "3307:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql
    networks:
      - skillsphere-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # MySQL - Base de données Professional Events
  # ============================================
  mysql-events:
    image: mysql:8.0
    container_name: mysql-events
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: professional_events_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_events_data:/var/lib/mysql
    networks:
      - skillsphere-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # 1. Eureka Server - Service Discovery
  # Port: 8761
  # ============================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - skillsphere-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================
  # 2. API Gateway
  # Port: 8080
  # ============================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - skillsphere-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================
  # 3. PlatformeBack - Auth Service
  # Port: 8086
  # ============================================
  platforme-back:
    build:
      context: ./PlatformeBack/PlatformeBack
      dockerfile: Dockerfile
    container_name: platforme-back
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-auth:3306/platforme?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JWT_SECRET=THIS_IS_A_VERY_LONG_SECRET_KEY_CHANGE_ME_1234567890_ABCDEFG
    depends_on:
      mysql-auth:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - skillsphere-network

  # ============================================
  # 4. Professional Events Service
  # Port: 8087
  # ============================================
  professional-events:
    build:
      context: "C:\\Users\\DELL\\Desktop\\skillsphere-microservices-eureka\\Professional Events"
      dockerfile: Dockerfile
    container_name: professional-events
    ports:
      - "8087:8087"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-events:3306/professional_events_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JWT_SECRET=THIS_IS_A_VERY_LONG_SECRET_KEY_CHANGE_ME_1234567890_ABCDEFG
    depends_on:
      mysql-events:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - skillsphere-network

    # ============================================
  # 5. Frontend Angular
  # Port: 80 (accès direct via localhost)
  # ============================================
  frontend:
    profiles: ["frontend"]
    build:
      context: "C:\\Users\\DELL\\Desktop\\wetransfer_pi_4eme-template-rar_2026-02-23_2049\\PI_4eme-Template\\PI_4eme-Template\\Platforme"
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - skillsphere-network


# ============================================
# Volumes persistants pour MySQL
# ============================================
volumes:
  mysql_auth_data:
  mysql_events_data:

# ============================================
# Réseau partagé entre tous les services
# ============================================
networks:
  skillsphere-network:
    driver: bridge
