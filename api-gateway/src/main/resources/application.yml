spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Route pour Auth Service (Login, Register)
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # Route pour Users Management
        - id: users-service
          uri: lb://auth-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0

        # Route pour Tasks Management
        - id: tasks-service
          uri: lb://auth-service
          predicates:
            - Path=/api/tasks/**
          filters:
            - StripPrefix=0

        # Route pour Competitions Service
        - id: competitions-service
          uri: lb://competitions-service
          predicates:
            - Path=/api/competitions/**,/api/events/**,/api/participants/**,/api/teams/**,/api/sessions/**,/api/leaderboards/**,/api/awards/**,/api/stream/**,/api/chat/**,/api/sms/**,/api/notifications/**,/api/chatbot/**,/api/draw/**,/api/matches/**
          filters:
            - StripPrefix=0

        # Route WebSocket pour Competitions Service (SockJS + STOMP)
        - id: competitions-websocket
          uri: lb:ws://competitions-service
          predicates:
            - Path=/ws-chat/**
          filters:
            - StripPrefix=0

        # Route pour Formation Service
        - id: formation-service
          uri: lb://FORMATION-SERVICE
          predicates:
            - Path=/formation-service/**
          filters:
            - StripPrefix=1

      # Configuration CORS globale
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:4201"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # Configuration par défaut
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# Configuration du serveur
server:
  port: 8080

# Configuration Eureka Client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Configuration des logs
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.netflix.eureka: INFO
    reactor.netty: INFO

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
