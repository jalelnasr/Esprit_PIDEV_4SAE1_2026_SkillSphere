spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Routes vers les microservices
      routes:
        # ============================================
        # Route vers PlatformeBack (Module User)
        # ============================================
        - id: user-service-auth
          uri: lb://PLATFORMEBACK
          predicates:
            - Path=/api/auth/**

        - id: user-service-users
          uri: lb://PLATFORMEBACK
          predicates:
            - Path=/api/users/**

        # ============================================
        # Route vers B2BModule (Module Corporate)
        # ============================================
        - id: b2b-service
          uri: lb://B2BMODULE
          predicates:
            - Path=/api/b2b/**

      # CORS global
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # Propagation des headers (JWT Authorization)
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

server:
  port: 8080

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

