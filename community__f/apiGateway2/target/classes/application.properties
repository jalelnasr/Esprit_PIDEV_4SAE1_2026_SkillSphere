server.port=8081
spring.application.name=api-gateway

# Eureka Client Configuration
eureka.client.service-url.default-zone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

# Gateway Routes Configuration
spring.cloud.gateway.routes[0].id=PLATFORMEBACK
spring.cloud.gateway.routes[0].uri=lb://PLATFORMEBACK
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[1].id=community-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/community/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/community/(?<segment>.*), /api/$\{segment}

# Forward auth endpoints to PLATFORMEBACK service (no token needed for login/register)
spring.cloud.gateway.routes[2].id=PLATFORMEBACK-AUTH-API
spring.cloud.gateway.routes[2].uri=lb://PLATFORMEBACK
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/**

# Backward compatibility: /auth/** -> /api/auth/**
spring.cloud.gateway.routes[3].id=PLATFORMEBACK-AUTH-COMPAT
spring.cloud.gateway.routes[3].uri=lb://PLATFORMEBACK
spring.cloud.gateway.routes[3].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/auth/(?<segment>.*), /api/auth/$\{segment}

# OpenAPI docs proxy routes for Swagger aggregation
spring.cloud.gateway.routes[4].id=PLATFORMEBACK-OPENAPI
spring.cloud.gateway.routes[4].uri=lb://PLATFORMEBACK
spring.cloud.gateway.routes[4].predicates[0]=Path=/platformeback/v3/api-docs
spring.cloud.gateway.routes[4].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.routes[5].id=COMMUNITY-SERVICE-OPENAPI
spring.cloud.gateway.routes[5].uri=http://localhost:8082
spring.cloud.gateway.routes[5].predicates[0]=Path=/community-service/v3/api-docs
spring.cloud.gateway.routes[5].filters[0]=SetPath=/api-docs

# Backward compatibility: /users/** -> /api/users/**
spring.cloud.gateway.routes[6].id=PLATFORMEBACK-USERS-COMPAT
spring.cloud.gateway.routes[6].uri=lb://PLATFORMEBACK
spring.cloud.gateway.routes[6].predicates[0]=Path=/users/**
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/users/(?<segment>.*), /api/users/$\{segment}

# User Service Direct URL (for testing)
user.service.url=http://localhost:8086



# CORS Configuration
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Expose-Headers Vary
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=http://localhost:4200,http://localhost:5173,http://localhost:30799,http://localhost:14445
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers=Authorization
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.reactive=DEBUG

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls-primary-name=Gateway
springdoc.swagger-ui.urls[0].name=Gateway
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=PlatformeBack
springdoc.swagger-ui.urls[1].url=/platformeback/v3/api-docs
springdoc.swagger-ui.urls[2].name=Community-Service
springdoc.swagger-ui.urls[2].url=/community-service/v3/api-docs
