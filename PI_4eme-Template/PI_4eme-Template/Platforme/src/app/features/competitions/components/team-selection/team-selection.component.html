<div class="team-selection">
  <h3 class="section-title">Sélectionnez votre Groupe</h3>
  
  <div class="teams-grid">
    <div *ngFor="let team of teams" 
         class="team-card" 
         [class.user-team]="isUserInTeam(team)"
         [class.full]="team.isFull">
      
      <!-- Team Header -->
      <div class="team-header">
        <div class="team-info">
          <h4 class="team-name">{{ team.teamName }}</h4>
          <span class="team-status" [ngClass]="getProgressClass(team)">
            {{ team.currentMembers }} / {{ team.maxMembers }} membres
          </span>
        </div>
        
        <!-- Progress Bar -->
        <div class="progress-bar">
          <div class="progress-fill" 
               [ngClass]="getProgressClass(team)"
               [style.width.%]="getProgressPercentage(team)">
          </div>
        </div>
      </div>

      <!-- Team Members -->
      <div class="team-members">
        <div class="members-title">Membres:</div>
        <div class="members-list">
          <div *ngFor="let member of team.members" class="member-item">
            <div class="member-avatar">
              {{ member.userName.charAt(0).toUpperCase() }}
            </div>
            <span class="member-name">{{ member.userName }}</span>
            <span *ngIf="member.userId === currentUserId" class="you-badge">Vous</span>
          </div>
          
          <!-- Empty Slots -->
          <div *ngFor="let i of [].constructor(team.maxMembers - team.currentMembers)" 
               class="member-item empty">
            <div class="member-avatar empty">?</div>
            <span class="member-name">Place disponible</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="team-actions">
        <!-- User is in this team -->
        <button *ngIf="isUserInTeam(team)" 
                class="btn btn-danger"
                (click)="onLeaveTeam(team.teamId)">
          <span>🚪</span> Quitter le Groupe
        </button>

        <!-- User can join this team -->
        <button *ngIf="!isUserInTeam(team) && canJoinTeam(team)" 
                class="btn btn-primary"
                (click)="onJoinTeam(team.teamId)">
          <span>✅</span> Rejoindre
        </button>

        <!-- Team is full -->
        <button *ngIf="!isUserInTeam(team) && team.isFull" 
                class="btn btn-disabled"
                disabled>
          <span>🔒</span> Complet
        </button>

        <!-- User already in another team -->
        <button *ngIf="!isUserInTeam(team) && !canJoinTeam(team) && !team.isFull" 
                class="btn btn-disabled"
                disabled>
          <span>⚠️</span> Déjà dans un groupe
        </button>
      </div>
    </div>
  </div>

  <!-- No Teams Message -->
  <div *ngIf="teams.length === 0" class="no-teams">
    <span class="icon">👥</span>
    <p>Aucun groupe disponible pour cette compétition.</p>
  </div>
</div>
