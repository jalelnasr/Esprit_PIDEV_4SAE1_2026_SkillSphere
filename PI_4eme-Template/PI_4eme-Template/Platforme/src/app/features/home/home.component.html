<div class="home-container">
  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar-container">
      <div class="logo">
        <span class="logo-text">SkillSphere</span>
      </div>
      <div class="nav-buttons">
        <button class="theme-toggle" (click)="toggleTheme()" [title]="isDarkMode ? 'Light Mode' : 'Dark Mode'">
          {{ isDarkMode ? '☀️' : '🌙' }}
        </button>
        <button class="btn-login" (click)="openAuthModal('login')">Login</button>
        <button class="btn-signup" (click)="openAuthModal('register')">Sign Up</button>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <div class="hero-text">
        <h1 class="hero-title">
          Welcome to <span class="gradient-text">SkillSphere</span>
        </h1>
        <p class="hero-subtitle">
          Master new professional skills online with expert-led courses and recognized certifications.
        </p>
        <div class="hero-buttons">
          <button class="btn-primary-hero" (click)="openAuthModal('register')">
            Start for Free
          </button>
          <button class="btn-secondary-hero" (click)="openAuthModal('login')">
            Login
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-section">
        <h4>SkillSphere</h4>
        <p>Empowering learners worldwide with quality education</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 SkillSphere. All rights reserved.</p>
    </div>
  </footer>

  <!-- Auth Modal -->
  <app-auth-modal 
    *ngIf="showAuthModal"
    [mode]="authModalMode"
    (closeModal)="closeAuthModal()">
  </app-auth-modal>
</div>
