<div class="my-courses-container">
  <!-- Back Button -->
  <button class="back-btn" (click)="goBack()" title="Go back">
    <span class="back-icon">←</span>
  </button>

  <h1>My Courses</h1>

  <!-- In Progress Courses -->
  <section class="courses-section">
    <h2>Courses in Progress</h2>
    <div class="courses-list">
      <div *ngFor="let course of enrolledCourses" class="course-item">
        <div class="course-thumbnail">
          <img [src]="course.thumbnail" [alt]="course.title" />
          <div class="progress-badge">{{ course.progress }}%</div>
        </div>
        <div class="course-info">
          <h3>{{ course.title }}</h3>
          <div class="course-meta">
            <span>📚 {{ course.completedLessons }}/{{ course.totalLessons }} lessons</span>
            <span>⏱️ {{ course.duration }}h total</span>
            <span>🕐 Last accessed {{ course.lastAccessed }}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" [style.width.%]="course.progress"></div>
          </div>
        </div>
        <button class="continue-btn" (click)="continueLearning(course.id)">
          Continue Learning
        </button>
      </div>
    </div>
  </section>

  <!-- Completed Courses -->
  <section class="courses-section">
    <h2>Completed Courses</h2>
    <div class="courses-grid">
      <div *ngFor="let course of completedCourses" class="completed-card">
        <img [src]="course.thumbnail" [alt]="course.title" class="completed-thumbnail" />
        <div class="completed-info">
          <h3>{{ course.title }}</h3>
          <div class="completed-badges">
            <span class="badge certificate" *ngIf="course.certificate">
              🏆 Certificate
            </span>
            <span class="badge rating">⭐ {{ course.rating }}</span>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
