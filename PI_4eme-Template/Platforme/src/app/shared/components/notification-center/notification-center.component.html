<div class="notification-bell" (click)="togglePanel()">
  <span class="bell-icon">🔔</span>
  <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
</div>

<div class="notification-panel" *ngIf="isOpen">
  <div class="panel-header">
    <h3>Notifications</h3>
    <button class="mark-all-btn" (click)="markAllAsRead()" *ngIf="unreadCount > 0">
      Tout marquer comme lu
    </button>
  </div>

  <div class="notifications-list">
    <div *ngIf="notifications.length === 0" class="empty-state">
      <p>Aucune notification</p>
    </div>

    <div 
      *ngFor="let notification of notifications" 
      class="notification-item"
      [class.unread]="!notification.isRead"
      (click)="markAsRead(notification)">
      
      <div class="notification-icon">
        {{ getNotificationIcon(notification.type) }}
      </div>

      <div class="notification-content">
        <div class="notification-title">{{ notification.title }}</div>
        <div class="notification-message">{{ notification.message }}</div>
        <div class="notification-time">{{ getTimeAgo(notification.createdAt) }}</div>
      </div>

      <button class="delete-btn" (click)="deleteNotification(notification); $event.stopPropagation()">
        ✕
      </button>
    </div>
  </div>
</div>

<div class="overlay" *ngIf="isOpen" (click)="togglePanel()"></div>
