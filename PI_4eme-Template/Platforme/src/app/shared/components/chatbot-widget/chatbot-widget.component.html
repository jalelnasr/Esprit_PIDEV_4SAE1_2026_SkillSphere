<!-- Bouton flottant pour ouvrir le chatbot -->
<div class="chatbot-button" *ngIf="!isOpen" (click)="toggleChat()">
  <span class="bot-icon">🤖</span>
  <span class="bot-text">Aide</span>
</div>

<!-- Fenêtre du chatbot -->
<div class="chatbot-window" *ngIf="isOpen" [class.minimized]="isMinimized">
  <!-- En-tête -->
  <div class="chatbot-header">
    <div class="header-left">
      <span class="bot-avatar">🤖</span>
      <div class="header-info">
        <span class="bot-name">EventBot</span>
        <span class="bot-status">● En ligne</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="header-btn" (click)="minimizeChat()" title="Réduire">
        <span *ngIf="!isMinimized">−</span>
        <span *ngIf="isMinimized">□</span>
      </button>
      <button class="header-btn" (click)="closeChat()" title="Fermer">×</button>
    </div>
  </div>

  <!-- Messages -->
  <div class="chatbot-messages" *ngIf="!isMinimized">
    <div *ngFor="let msg of messages" 
         class="message" 
         [class.user-message]="!msg.isBot"
         [class.bot-message]="msg.isBot">
      <div class="message-content">
        <div class="message-avatar" *ngIf="msg.isBot">🤖</div>
        <div class="message-bubble">
          <div class="message-text">{{ msg.text }}</div>
          <div class="message-time">{{ msg.timestamp | date: 'HH:mm' }}</div>
        </div>
        <div class="message-avatar" *ngIf="!msg.isBot">👤</div>
      </div>
    </div>

    <!-- Indicateur de frappe -->
    <div class="message bot-message" *ngIf="isTyping">
      <div class="message-content">
        <div class="message-avatar">🤖</div>
        <div class="message-bubble">
          <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Zone de saisie -->
  <div class="chatbot-input" *ngIf="!isMinimized">
    <input 
      type="text" 
      [(ngModel)]="userInput"
      (keypress)="onKeyPress($event)"
      placeholder="Pose ta question..."
      class="input-field">
    <button 
      (click)="sendMessage()" 
      [disabled]="!userInput.trim()"
      class="send-button">
      📤
    </button>
  </div>
</div>
