<div class="auth-container">
  <div class="auth-background">
    <div class="auth-bg-gradient"></div>
  </div>

  <div class="auth-content">
    <div class="auth-card">
      <button class="back-btn" (click)="goBack()" title="Go back">
        <span class="back-icon">←</span>
      </button>

      <div class="auth-header">
        <div class="auth-logo">🔁</div>
        <h1>Reset Password</h1>
        <p>Choose a new password for your account</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <div class="password-field">
            <input
              class="form-input"
              [type]="showNew ? 'text' : 'password'"
              formControlName="newPassword"
              placeholder="••••••••"
            />
            <button type="button" class="toggle-password" (click)="showNew = !showNew">
              {{ showNew ? '👁️' : '👁️‍🗨️' }}
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="password-field">
            <input
              class="form-input"
              [type]="showConfirm ? 'text' : 'password'"
              formControlName="confirm"
              placeholder="••••••••"
            />
            <button type="button" class="toggle-password" (click)="showConfirm = !showConfirm">
              {{ showConfirm ? '👁️' : '👁️‍🗨️' }}
            </button>
          </div>
        </div>

        <button class="submit-btn" type="submit" [disabled]="form.invalid || loading">
          {{ loading ? 'Saving...' : 'Reset Password' }}
        </button>

        <div class="auth-footer">
          <p>
            Back to
            <a routerLink="/auth/login" class="signup-link">Login</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
