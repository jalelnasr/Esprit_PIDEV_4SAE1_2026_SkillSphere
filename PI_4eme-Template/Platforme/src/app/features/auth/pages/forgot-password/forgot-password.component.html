<div class="auth-container">
  <div class="auth-background">
    <div class="auth-bg-gradient"></div>
  </div>

  <div class="auth-content">
    <div class="auth-card">
      <!-- Back Button -->
      <button class="back-btn" (click)="goBack()" title="Go back">
        <span class="back-icon">←</span>
      </button>

      <!-- Header -->
      <div class="auth-header">
        <div class="auth-logo">🔐</div>
        <h1>Mot de passe oublié</h1>
        <p>Entrez votre email et nous vous enverrons un lien de réinitialisation</p>
      </div>

      <!-- Form -->
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <div class="form-group">
          <label class="form-label">Adresse email *</label>
          <input
            type="email"
            class="form-input"
            formControlName="email"
            placeholder="vous@exemple.com"
            [class.error]="!!emailError"
          />
          <span class="form-error" *ngIf="emailError">{{ emailError }}</span>
        </div>

        <button class="submit-btn" type="submit" [disabled]="form.invalid || loading">
          {{ loading ? 'Envoi en cours...' : 'Envoyer le lien' }}
        </button>

        <div class="auth-footer">
          <p>
            Vous vous souvenez de votre mot de passe ?
            <a routerLink="/auth/login" class="signup-link">Retour à la connexion</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
