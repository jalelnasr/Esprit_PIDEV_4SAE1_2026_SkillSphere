<div class="auth-container">
  <div class="auth-background">
    <div class="auth-bg-gradient"></div>
  </div>

  <div class="auth-content">
    <div class="auth-card">
      <!-- Back Button -->
      <button class="back-btn" (click)="goBack()" title="Go back">
        <span class="back-icon">←</span>
      </button>

      <!-- Header -->
      <div class="auth-header">
        <div class="auth-logo">🔐</div>
        <h1>Forgot Password</h1>
        <p>Enter your email and we will send you a reset link</p>
      </div>

      <!-- Form -->
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input
            type="email"
            class="form-input"
            formControlName="email"
            placeholder="you@example.com"
            [class.error]="!!emailError"
          />
          <span class="form-error" *ngIf="emailError">{{ emailError }}</span>
        </div>

        <button class="submit-btn" type="submit" [disabled]="form.invalid || loading">
          {{ loading ? 'Sending...' : 'Send Reset Link' }}
        </button>

        <div class="auth-footer">
          <p>
            Remembered your password?
            <a routerLink="/auth/login" class="signup-link">Back to login</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
