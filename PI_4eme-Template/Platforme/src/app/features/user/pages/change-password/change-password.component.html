<div class="cp-container">
  <div class="cp-card">
    <h2>Change Password</h2>
    <p class="sub">Update your password securely.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Old Password</label>
        <div class="pw">
          <input [type]="showOld ? 'text' : 'password'" formControlName="oldPassword" placeholder="Old password" />
          <button type="button" class="eye" (click)="showOld = !showOld">{{ showOld ? '🙈' : '👁️' }}</button>
        </div>
      </div>

      <div class="field">
        <label>New Password</label>
        <div class="pw">
          <input [type]="showNew ? 'text' : 'password'" formControlName="newPassword" placeholder="New password" />
          <button type="button" class="eye" (click)="showNew = !showNew">{{ showNew ? '🙈' : '👁️' }}</button>
        </div>
        <small class="hint">Minimum 8 characters</small>
      </div>

      <div class="field">
        <label>Confirm New Password</label>
        <div class="pw">
          <input [type]="showConfirm ? 'text' : 'password'" formControlName="confirm" placeholder="Confirm new password" />
          <button type="button" class="eye" (click)="showConfirm = !showConfirm">{{ showConfirm ? '🙈' : '👁️' }}</button>
        </div>
      </div>

      <button class="btn" type="submit" [disabled]="loading">
        {{ loading ? 'Saving...' : 'Save' }}
      </button>
    </form>
  </div>
</div>
