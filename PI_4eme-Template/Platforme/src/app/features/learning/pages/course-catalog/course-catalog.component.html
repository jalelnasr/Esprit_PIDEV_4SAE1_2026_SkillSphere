<div class="catalog-container">
  <!-- Back Button -->
  <button class="back-btn" (click)="goBack()" title="Go back">
    <span class="back-icon">←</span>
  </button>

  <div class="catalog-header">
    <h1>Browse Courses</h1>
    <p>Discover thousands of professional courses and training programs</p>
  </div>

  <div class="catalog-layout">
    <!-- Sidebar Filters -->
    <aside class="catalog-sidebar">
      <div class="filter-group">
        <h3>Search</h3>
        <input 
          type="text" 
          placeholder="Search courses..." 
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()"
          class="search-input"
        />
      </div>

      <div class="filter-group">
        <h3>Category</h3>
        <div class="filter-options">
          <label *ngFor="let cat of categories" class="filter-option">
            <input 
              type="radio" 
              [value]="cat" 
              [checked]="selectedCategory === cat"
              (change)="onCategoryChange(cat)"
            />
            <span>{{ cat }}</span>
          </label>
        </div>
      </div>

      <div class="filter-group">
        <h3>Level</h3>
        <div class="filter-options">
          <label *ngFor="let level of levels" class="filter-option">
            <input 
              type="radio" 
              [value]="level" 
              [checked]="selectedLevel === level"
              (change)="onLevelChange(level)"
            />
            <span>{{ level }}</span>
          </label>
        </div>
      </div>

      <div class="filter-group">
        <h3>Price Range</h3>
        <div class="price-range">
          <label>
            Min: <input type="number" [(ngModel)]="priceRange[0]" min="0" />
          </label>
          <label>
            Max: <input type="number" [(ngModel)]="priceRange[1]" max="1000" />
          </label>
        </div>
      </div>
    </aside>

    <!-- Courses Grid -->
    <section class="courses-section">
      <div class="courses-header">
        <span class="results-count">Showing all courses</span>
        <select class="sort-select">
          <option>Most Popular</option>
          <option>Newest</option>
          <option>Price: Low to High</option>
          <option>Price: High to Low</option>
          <option>Top Rated</option>
        </select>
      </div>

      <div class="courses-grid" *ngIf="courses$ | async as result">
        <app-course-card 
          *ngFor="let course of result.data" 
          [course]="course"
        ></app-course-card>
      </div>

      <!-- Pagination -->
      <div class="pagination">
        <button class="page-btn" [disabled]="currentPage === 1" (click)="currentPage = 1">First</button>
        <button class="page-btn" [disabled]="currentPage === 1">Previous</button>
        <span class="page-info">Page {{ currentPage }} of 10</span>
        <button class="page-btn">Next</button>
        <button class="page-btn">Last</button>
      </div>
    </section>
  </div>
</div>
