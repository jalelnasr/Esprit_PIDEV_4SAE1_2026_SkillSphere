<div class="course-details-container" *ngIf="course">
  <!-- Header -->
  <div class="course-header">
    <button class="back-btn" (click)="goBack()">
      <i class="fas fa-arrow-left"></i> Retour
    </button>
    
    <div class="course-hero" [style.backgroundImage]="course.thumbnailUrl ? 'url(' + course.thumbnailUrl + ')' : 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'">
      <div class="hero-overlay">
        <div class="hero-content">
          <h1>{{ course.title }}</h1>
          <div class="course-meta">
            <span class="badge">{{ course.level }}</span>
            <span class="badge">{{ course.language }}</span>
            <span class="badge">{{ course.durationMinutes }} min</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Main Content -->
  <div class="content-grid">
    <!-- Left Column: Course Info -->
    <div class="main-content">
      <section class="description-section">
        <h2>Description</h2>
        <p>{{ course.description }}</p>
      </section>
      
      <!-- Reviews Section -->
      <section class="reviews-section">
        <div class="section-header">
          <h2>Avis et Notes</h2>
          <button 
            *ngIf="canReview" 
            class="btn-add-review" 
            (click)="openReviewModal()">
            ✍️ Donner mon avis
          </button>
        </div>
        
        <div class="review-notice" *ngIf="!canReview && !isEnrolled">
          <i class="fas fa-info-circle"></i>
          Vous devez être inscrit pour donner votre avis
        </div>
        
        <app-course-reviews-list [courseId]="courseId"></app-course-reviews-list>
      </section>
    </div>
    
    <!-- Right Column: Actions -->
    <div class="sidebar">
      <div class="action-card">
        <h3>Commencer la formation</h3>
        
        <button 
          *ngIf="!isEnrolled" 
          class="btn-enroll" 
          (click)="enrollInCourse()">
          S'inscrire maintenant
        </button>
        
        <button 
          *ngIf="isEnrolled" 
          class="btn-start" 
          (click)="startCourse()">
          Continuer le cours
        </button>
        
        <div class="course-stats">
          <div class="stat-item">
            <i class="fas fa-clock"></i>
            <span>{{ course.durationMinutes }} minutes</span>
          </div>
          <div class="stat-item">
            <i class="fas fa-signal"></i>
            <span>{{ course.level }}</span>
          </div>
          <div class="stat-item">
            <i class="fas fa-language"></i>
            <span>{{ course.language }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Review Modal -->
<app-course-review-modal
  [isOpen]="isReviewModalOpen"
  [courseId]="courseId"
  [courseTitle]="course?.title || ''"
  [userId]="currentUserId || 0"
  (closed)="closeReviewModal()"
  (reviewSubmitted)="onReviewSubmitted()">
</app-course-review-modal>
