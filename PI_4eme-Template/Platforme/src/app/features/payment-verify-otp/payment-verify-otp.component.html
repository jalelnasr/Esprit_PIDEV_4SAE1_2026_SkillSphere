<div class="otp-container">
  <div class="otp-card">
    <div class="otp-header">
      <div class="icon">📧</div>
      <h1>Vérification par email</h1>
      <p>Un code à 6 chiffres a été envoyé à</p>
      <p class="email">{{ email }}</p>
    </div>

    <div class="otp-form">
      <label for="otpCode">Code de vérification</label>
      <input 
        type="text" 
        id="otpCode"
        name="otpCode"
        [(ngModel)]="otpCode"
        (input)="onOtpInput($event)"
        maxlength="6"
        placeholder="000000"
        class="otp-input"
        [disabled]="verifying"
        autofocus>

      <button 
        class="btn-verify"
        (click)="verifyOtp()"
        [disabled]="otpCode.length !== 6 || verifying">
        <span *ngIf="!verifying">✓ Vérifier le code</span>
        <span *ngIf="verifying">⏳ Vérification...</span>
      </button>

      <button 
        class="btn-resend"
        (click)="resendOtp()"
        [disabled]="resending">
        <span *ngIf="!resending">🔄 Renvoyer le code</span>
        <span *ngIf="resending">⏳ Envoi...</span>
      </button>

      <button 
        class="btn-back"
        (click)="goBack()">
        ← Retour aux plans
      </button>
    </div>

    <div class="otp-info">
      <p>💡 Le code expire dans 10 minutes</p>
      <p>📬 Vérifiez votre dossier spam si vous ne le trouvez pas</p>
    </div>
  </div>
</div>
