<header class="topbar" (click)="closeMenus()">
  <div class="topbar-content">
    <!-- Search Bar -->
    <div class="search-bar">
      <input
        type="text"
        placeholder="Search courses, topics, teachers..."
        [(ngModel)]="searchQuery"
        (keyup.enter)="search()"
        class="search-input"
      />
      <button class="search-btn" (click)="search()" title="Search">
        🔍
      </button>
    </div>

    <!-- Right Side Actions -->
    <div class="topbar-actions">
      <!-- Notifications Bell -->
      <app-notification-center></app-notification-center>
      
      <!-- User Menu -->
      <div class="user-menu-wrapper" *ngIf="currentUser$ | async as user">
        <button
          class="user-btn"
          (click)="toggleUserMenu(); $event.stopPropagation()"
          title="User Menu"
        >
          <span class="user-avatar-small">{{ user?.prenom?.charAt(0) || '' }}</span>
          <span class="user-name-small">{{ user.prenom }}</span>
          <span class="dropdown-arrow">▼</span>
        </button>

        <div class="dropdown user-dropdown" *ngIf="showUserMenu">
          <div class="dropdown-header">
            <div class="user-info-header">
              <div class="user-avatar-large">{{ user?.prenom?.charAt(0) || '' }}</div>
              <div>
                <p class="user-full-name">{{ user.prenom }} {{ user.nom }}</p>
                <p class="user-email">{{ user.email }}</p>
              </div>
            </div>
          </div>

          <div class="dropdown-divider"></div>

          <div class="dropdown-menu">
            <a routerLink="/user/profile" class="dropdown-item">👤 My Profile</a>
            <a href="#" class="dropdown-item">⚙️ Settings</a>
            <a href="#" class="dropdown-item">🎖️ My Achievements</a>
            <a href="#" class="dropdown-item">💰 Wallet</a>
            <a href="#" class="dropdown-item">❓ Help & Support</a>
            <a routerLink="/user/change-password" class="dropdown-item">🔒 Change Password</a>
          </div>

          <div class="dropdown-divider"></div>

          <button class="logout-link" (click)="logout()">
            🚪 Logout
          </button>
        </div>
      </div>

      <!-- Theme Toggle -->
      <button class="action-btn" (click)="toggleTheme(); $event.stopPropagation()" title="Toggle Theme">
        {{ isDarkMode ? '☀️' : '🌙' }}
      </button>
    </div>
  </div>
</header>
