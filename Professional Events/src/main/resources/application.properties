spring.application.name=competitions-service

# Server Configuration
server.port=8087

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/professional_events_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA Configuration
# IMPORTANT: Utiliser 'none' pour éviter qu'Hibernate modifie la structure de la base de données
# Les migrations doivent être faites manuellement via des scripts SQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# H2 console disabled (using MySQL)
spring.h2.console.enabled=false

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JWT Configuration - IMPORTANT: Cette clé DOIT être identique au backend Auth
jwt.secret=THIS_IS_A_VERY_LONG_SECRET_KEY_CHANGE_ME_1234567890_ABCDEFG
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:4200

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Twilio SMS Configuration
twilio.account.sid=ACc5ac7e4f047bbdaaf4589fba69e631b8
twilio.auth.token=186d8b992fe148c93b9208d4f882e155
twilio.phone.number=+13526965242
twilio.enabled=true
