spring.application.name=auth-service

# DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/platforme?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Server Configuration
server.port=8086

# JWT Configuration - IMPORTANT: Cette clé doit être identique dans tous les microservices
jwt.secret=THIS_IS_A_VERY_LONG_SECRET_KEY_CHANGE_ME_1234567890_ABCDEFG
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:4200
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true