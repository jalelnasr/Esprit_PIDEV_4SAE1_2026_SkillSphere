<section class="quiz-section">
  <div class="quiz-card" [formGroup]="quizForm">
    <h2>Create Quiz</h2>

    <div class="form-group">
      <label>Passing Score</label>
      <input type="number" formControlName="passingScore" />
    </div>

    <div class="row-buttons">
      <button class="btn-primary" type="button" (click)="createQuiz()">
        Create Quiz
      </button>

      <button class="btn-primary" type="button" (click)="saveQuestions()" [disabled]="!quiz">
        Save Questions
      </button>
    </div>

    <hr />

    <h2>Questions</h2>

    <button class="btn-secondary" type="button" (click)="addQuestion()">
      + Add Question
    </button>

    <div formArrayName="questions">
      <div *ngFor="let q of questions.controls; let i = index"
           [formGroupName]="i"
           class="question-card">

        <div class="form-group">
          <label>Question</label>
          <input formControlName="text" placeholder="Question text">
        </div>

        <div class="form-group">
          <label>Points</label>
          <input type="number" formControlName="points">
        </div>

        <button class="btn-add" type="button" (click)="addChoice(i)">
          + Add Choice
        </button>

        <div formArrayName="choices">
          <div *ngFor="let c of getChoices(i).controls; let j=index"
               [formGroupName]="j"
               class="choice-item">

            <input formControlName="label" placeholder="Choice label">

            <label>
              <input type="checkbox" formControlName="isCorrect">
              Correct
            </label>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
