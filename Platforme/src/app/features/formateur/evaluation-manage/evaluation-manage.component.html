<!-- ================= HERO SECTION ================= -->
<section class="evaluation-hero">

  <div class="hero-background">
    <div class="gradient-sphere sphere-1"></div>
    <div class="gradient-sphere sphere-2"></div>
  </div>

  <div class="evaluation-hero-content">
    <h1>Manage Evaluation</h1>
    <p>Update details, manage quizzes, and publish your assessment</p>

    <div class="status-badge">
      Status: <span>{{ evaluation?.status }}</span>
    </div>
  </div>

</section>


<!-- ================= FORM SECTION ================= -->
<section class="evaluation-section">

  <div class="evaluation-card">

    <form [formGroup]="form" (ngSubmit)="save()">

      <div class="form-group">
        <label>Evaluation Title</label>
        <input type="text"
               formControlName="title"
               placeholder="Ex: Java Advanced Certification" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea rows="4"
                  formControlName="description"
                  placeholder="Describe the purpose of this evaluation..."></textarea>
      </div>

      <div class="row-buttons">
        <button class="btn-create" type="submit">
          💾 Save Changes
        </button>

        <button class="btn-secondary"
                type="button"
                (click)="goToQuiz()">
          📝 Create / Edit Quiz
        </button>
      </div>

    </form>

  </div>


  <!-- ACTION BUTTONS -->
  <div class="row danger-zone">

    <button class="btn-publish" (click)="publish()">
      🚀 Publish
    </button>

    <button class="btn-delete" (click)="delete()">
      🗑 Delete
    </button>

  </div>

</section>
