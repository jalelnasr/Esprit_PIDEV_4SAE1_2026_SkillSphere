<section class="evaluation-hero">

  <div class="hero-background">
    <div class="gradient-sphere sphere-1"></div>
    <div class="gradient-sphere sphere-2"></div>
  </div>

  <div class="evaluation-hero-content">
    <h1>Create a New Evaluation</h1>
    <p>Build professional assessments and certify your learners</p>
  </div>

</section>

<section class="evaluation-section">

  <div class="evaluation-card">

    <!-- Error Message -->
    <div *ngIf="errorMessage" style="color: #d32f2f; background: #ffebee; padding: 16px; border-radius: 4px; margin-bottom: 16px;">
      <strong>❌ Error:</strong> {{ errorMessage }}
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage" style="color: #388e3c; background: #e8f5e9; padding: 16px; border-radius: 4px; margin-bottom: 16px;">
      <strong>✅ Success:</strong> {{ successMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="form-group">
        <label>Evaluation Title</label>
        <input type="text"
               formControlName="title"
               placeholder="Ex: Java Advanced Certification" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea rows="5"
                  formControlName="description"
                  placeholder="Describe the purpose of this evaluation..."></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-create" [disabled]="isSubmitting || form.invalid">
          <span *ngIf="!isSubmitting">Create Evaluation</span>
          <span *ngIf="isSubmitting">⏳ Creating...</span>
        </button>
      </div>

    </form>

  </div>

</section>
