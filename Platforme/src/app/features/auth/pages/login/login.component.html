<div class="auth-container">
  <div class="auth-background">
    <div class="auth-bg-gradient"></div>
  </div>

  <div class="auth-content">
    <div class="auth-card">
      <!-- Back Button -->
      <button class="back-btn" (click)="goBack()" title="Go back">
        <span class="back-icon">←</span>
      </button>

      <!-- Header -->
      <div class="auth-header">
        <div class="auth-logo">🌐</div>
        <h1>SkillSphere</h1>
        <p>Professional Training & Certification Management</p>
      </div>

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="auth-form">
        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-input"
            formControlName="email"
            placeholder="you@example.com"
            [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          />
          <span class="form-error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            {{ getFieldError('email') }}
          </span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-field">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              class="form-input"
              formControlName="password"
              placeholder="••••••••"
              [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePasswordVisibility()"
              title="Toggle Password"
            >
              {{ showPassword ? '👁️' : '👁️‍🗨️' }}
            </button>
          </div>
          <span class="form-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            {{ getFieldError('password') }}
          </span>
        </div>

        <!-- Role Selection -->
        <div class="form-group">
          <label class="form-label">Login as</label>
          <div class="role-selector">
            <button 
              *ngFor="let role of roleOptions"
              type="button"
              class="role-btn"
              [class.active]="loginForm.get('role')?.value === role.value"
              (click)="loginForm.get('role')?.setValue(role.value)"
            >
              <span class="role-icon">{{ role.icon }}</span>
              <span class="role-text">{{ role.label }}</span>
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="form-actions">
          <label class="checkbox">
            <input type="checkbox" formControlName="rememberMe" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="submit-btn"
          [disabled]="loginForm.invalid || isLoading"
        >
          {{ isLoading ? 'Logging in...' : 'Sign In' }}
        </button>

        <!-- Divider -->
        <div class="divider">OR</div>

        <!-- Social Login -->
        <div class="social-login">
          <button type="button" class="social-btn google">
            🔵 Google
          </button>
          <button type="button" class="social-btn microsoft">
            ☁️ Microsoft
          </button>
        </div>
      </form>

      <!-- Sign Up Link -->
      <div class="auth-footer">
        <p>Don't have an account? <a href="/auth/register" class="signup-link">Sign up here</a></p>
      </div>
    </div>
  </div>
</div>
