<div class="auth-container">
  <div class="auth-background">
    <div class="auth-bg-gradient"></div>
  </div>

  <div class="auth-content">
    <div class="auth-card">
      <!-- Back Button -->
      <button class="back-btn" (click)="goBack()" title="Go back">
        <span class="back-icon">←</span>
      </button>

      <div class="auth-header">
        <div class="auth-logo">🌐</div>
        <h1>Create Account</h1>
        <p>Join SkillSphere and start learning today</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="auth-form">
        <!-- Name Fields -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">FIRST NAME</label>
            <input type="text" class="form-input" formControlName="firstName" placeholder="John" />
          </div>
          <div class="form-group">
            <label class="form-label">LAST NAME</label>
            <input type="text" class="form-input" formControlName="lastName" placeholder="Doe" />
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" formControlName="email" placeholder="you@example.com" />
        </div>

        <!-- Role Selection -->
        <div class="form-group">
          <label class="form-label">I am a</label>
          <div class="role-selector">
            <button 
              *ngFor="let role of roleOptions"
              type="button"
              class="role-btn"
              [class.active]="registerForm.get('role')?.value === role.value"
              (click)="registerForm.get('role')?.setValue(role.value)"
            >
              <span class="role-icon">{{ role.icon }}</span>
              <span class="role-text">{{ role.label }}</span>
            </button>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label">Password</label>
          <input 
            type="password" 
            class="form-input" 
            formControlName="password" 
            placeholder="••••••••"
          />
          <small class="password-hint">At least 8 characters</small>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input 
            type="password" 
            class="form-input" 
            formControlName="confirmPassword" 
            placeholder="••••••••"
          />
        </div>

        <!-- Terms -->
        <label class="checkbox">
          <input type="checkbox" formControlName="terms" />
          <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
        </label>

        <!-- Submit -->
        <button 
          type="submit" 
          class="submit-btn"
          [disabled]="registerForm.invalid || isLoading"
        >
          {{ isLoading ? 'Creating Account...' : 'Create Account' }}
        </button>
      </form>

      <!-- Login Link -->
      <div class="auth-footer">
        <p>Already have an account? <a href="/auth/login" class="signup-link">Sign in here</a></p>
      </div>
    </div>
  </div>
</div>
